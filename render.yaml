# Render Blueprint for the API. The client deploys separately to Vercel and
# reaches this service through the /api rewrite in student-project-hub/client/vercel.json.
services:
  - type: web
    name: student-project-hub-api
    runtime: node
    # The free plan sleeps when idle (about a minute to wake). Use a paid plan for launch.
    plan: free
    rootDir: student-project-hub
    buildCommand: npm ci && npm run build -w server
    preDeployCommand: npm run db:deploy -w server
    startCommand: npm start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Requests arrive via the Vercel rewrite and then Render's load balancer.
      - key: TRUST_PROXY
        value: 2
      # Same-site through the Vercel rewrite; use "none" only if the client calls this host directly.
      - key: COOKIE_SAME_SITE
        value: lax
      - key: CORS_ORIGINS
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: API_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: project-hub
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
